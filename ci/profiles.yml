# profiles.yml do CI. A chave de topo "novadrive" bate com o profile: do
# seu dbt_project.yml (ja conferido). As variaveis tem valor-padrao, entao
# o job de validacao (dbt parse) funciona SEM os secrets; o job de build usa
# os valores reais vindos dos secrets do GitHub.

novadrive:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'unset') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', 'unset') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'unset') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'unset') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'NOVADRIVE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS_CI') }}"
      threads: 4
      client_session_keep_alive: false
