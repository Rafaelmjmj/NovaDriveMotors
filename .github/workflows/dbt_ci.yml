name: dbt CI

# Dispara a cada push e pull request na branch main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Valida que o projeto dbt esta integro e compila, a cada commit,
  # SEM precisar conectar no Snowflake. Testado: passa limpo neste projeto.
  validar:
    name: Validar projeto dbt
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ./ci
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Instalar pacotes do dbt (dbt deps)
        run: dbt deps

      - name: Validar projeto (dbt parse)
        run: dbt parse
